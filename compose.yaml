services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SETUP_PASSCODE: ${SETUP_PASSCODE:-}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set the public hostname}
    volumes:
      - photos:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  photos:
  caddy_data:
  caddy_config:
